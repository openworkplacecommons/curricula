name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync Wiki Home and sidebar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub Wiki is a separate Git repository; avoid adding credentials to its URL.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" .wiki-checkout
          cp wiki/Home.md .wiki-checkout/Home.md
          cp wiki/_Sidebar.md .wiki-checkout/_Sidebar.md
          git -C .wiki-checkout config user.name 'github-actions[bot]'
          git -C .wiki-checkout config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .wiki-checkout add Home.md _Sidebar.md
          if git -C .wiki-checkout diff --cached --quiet; then
            echo 'Wiki is already up to date.'
          else
            git -C .wiki-checkout commit -m 'docs: synchronize OWC wiki navigation'
            git -C .wiki-checkout -c http.https://github.com/.extraheader="$AUTH_HEADER" push origin HEAD
            echo 'Wiki navigation published.'
          fi

      - name: Verify Wiki has navigation
        run: |
          test -s .wiki-checkout/Home.md
          test -s .wiki-checkout/_Sidebar.md
          echo 'Home and sidebar present in Wiki checkout.'
